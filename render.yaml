services:
  - type: web
    name: hushroom-server
    runtime: node
    plan: free
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://hushroom-chi.vercel.app,https://hushroom-3dh5yghb3-umarnaushad.vercel.app